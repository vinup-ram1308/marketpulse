version: 2

sources:
  - name: marketpulse_raw
    description: Immutable raw market observations loaded from the simulator.
    database: marketpulse-510219
    schema: marketpulse_raw
    tables:
      - name: raw_market_observations
        description: One raw row for each product, competitor, and observation time.
        columns:
          - name: observation_id
            description: Deterministic identifier for the product, competitor, and observation timestamp.
            data_tests:
              - not_null
          - name: batch_id
            description: Identifier shared by observations generated in the same batch.
            data_tests:
              - not_null
          - name: product_id
            description: Source catalog identifier for the observed product.
            data_tests:
              - not_null
          - name: product_name
            description: Display name of the observed product.
            data_tests:
              - not_null
          - name: category
            description: Product category from the product catalog.
            data_tests:
              - not_null
          - name: brand
            description: Product brand from the product catalog.
            data_tests:
              - not_null
          - name: competitor_id
            description: Source catalog identifier for the competitor.
            data_tests:
              - not_null
          - name: competitor_name
            description: Display name of the competitor.
            data_tests:
              - not_null
          - name: market
            description: Market associated with the competitor observation.
            data_tests:
              - not_null
          - name: observed_at
            description: UTC timestamp when the market observation was generated.
            data_tests:
              - not_null
          - name: price
            description: Observed product price in the row currency, stored as BigQuery NUMERIC.
            data_tests:
              - not_null
          - name: currency
            description: Currency code for the observed price.
            data_tests:
              - not_null
          - name: stock_status
            description: Inventory state reported by the simulator.
            data_tests:
              - not_null
          - name: stock_quantity
            description: Quantity associated with the reported inventory state.
            data_tests:
              - not_null
          - name: promotion_flag
            description: Whether a promotion was active for the observation.
            data_tests:
              - not_null
          - name: promotion_pct
            description: Promotion percentage, stored as BigQuery NUMERIC.
            data_tests:
              - not_null
          - name: source
            description: Name of the system that generated the observation.
            data_tests:
              - not_null
          - name: ingested_at
            description: UTC timestamp when the row was loaded into the RAW table.
            data_tests:
              - not_null
